[project]
name = "evidencetrace"
version = "0.1.0"
description = "An evidence-first, version-aware RAG service with evaluation and audit traces."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "openai>=1.0",
  "pypdf>=5.0",
  "certifi>=2024.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
